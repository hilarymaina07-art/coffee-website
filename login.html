        <h1>Login</h1>

            <div class="form-group">
                <label for="username" class="form-label" class="label">Username</label>
                <input type="text" name="username" placeholder="Enter your username" class="input" required>
            </div>
            <div class="form-group">
                <label for="password" class="form-label" class="label">Password</label>
                <input type="password" name="password" placeholder="Enter your password" class="input" required>
            </div>
        </form>
        <button id="button-login" type="submit" formaction="hex.html">Login</button>
        <p class="login-link">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
    
</body>
